name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR instead of letting them queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm exec tsc --noEmit

      - run: pnpm test

  integration:
    name: Integration tests (real local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: pnpm install --frozen-lockfile

      # Boots the same local Postgres/Auth/Storage/PostgREST stack `pnpm
      # supabase:start` runs in dev, via Docker (pre-installed on
      # ubuntu-latest), and applies every file under supabase/migrations/ —
      # this is the strongest signal CI can give that a new migration or
      # RPC change didn't break anything, short of a manual walkthrough.
      - name: Start local Supabase
        run: pnpm supabase start

      # supabase status -o env prints ANON_KEY/API_URL/SERVICE_ROLE_KEY —
      # fixed, publicly-documented local-dev values (identical on every
      # machine running the Supabase CLI's default local stack), never
      # real secrets, so no GitHub Actions secret is needed for this part.
      #
      # Phase 4.1 remediation: this used to write .env.local — the SAME
      # file a developer's real production config lives in locally. CI's
      # own copy was always safe (fresh values every run, thrown away with
      # the VM), but the shared filename meant "integration tests read
      # .env.local" was true in both places, and only CI's instance of
      # that file was actually safe. Tests now read the separate
      # TEST_SUPABASE_* namespace via .env.test.local, which nothing else
      # in the app or CI touches — see tests/integration/helpers/test-env.ts.
      - name: Write .env.test.local from the local Supabase stack
        run: |
          eval "$(pnpm supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          cat > .env.test.local <<EOF
          TEST_SUPABASE_URL=$API_URL
          TEST_SUPABASE_ANON_KEY=$ANON_KEY
          TEST_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          EOF

      # Most integration tests look up an existing admin/super_admin
      # account rather than creating their own — in every dev environment
      # so far that account already existed from the one-time
      # `pnpm create-super-admin` bootstrap a human runs once, but CI
      # starts from a genuinely empty database every run.
      #
      # Invoked directly (not via `pnpm create-super-admin`, which
      # hardcodes `dotenv -e .env.local`) — passing NEXT_PUBLIC_SUPABASE_URL/
      # SUPABASE_SERVICE_ROLE_KEY inline keeps this step working without
      # writing a .env.local at all, so nothing in this job ever creates
      # that file.
      - name: Bootstrap a super admin for the tests to find
        run: |
          eval "$(pnpm supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            pnpm exec tsx scripts/create-super-admin.ts --email ci-admin@example.com --password 'CiTestPassword123!' --name "CI Admin"

      - run: pnpm test:integration

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright's chromium browser
        run: pnpm exec playwright install --with-deps chromium

      # Same local-stack pattern as the integration job — invite-flow.spec.ts
      # creates its own admin/invitee via the shared test Supabase client
      # rather than relying on a bootstrapped account, so no
      # create-super-admin step is needed here.
      - name: Start local Supabase
        run: pnpm supabase start

      # Phase 4.2: only TEST_SUPABASE_* is needed here — playwright.config.ts
      # itself validates this and projects it (plus provider-disabled flags
      # and safe placeholders for Resend/cron/Sentry) onto the vars the
      # spawned `next dev` actually reads, via webServer.env. Nothing in
      # this job writes .env.local.
      - name: Write .env.test.local from the local Supabase stack
        run: |
          eval "$(pnpm supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          cat > .env.test.local <<EOF
          TEST_SUPABASE_URL=$API_URL
          TEST_SUPABASE_ANON_KEY=$ANON_KEY
          TEST_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          EOF

      # playwright.config.ts's webServer starts `pnpm dev` itself and waits
      # for it to respond before running specs.
      - run: pnpm test:e2e

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop
